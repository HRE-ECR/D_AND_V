name: Build
on:
 push:
  branches: [ main ]
 pull_request:
  branches: [ main ]
 workflow_dispatch:
permissions:
 contents: read
jobs:
 build:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-dotnet@v4
     with:
      dotnet-version: '10.0.x'
   - run: dotnet restore ProformaViewer.sln
   - run: dotnet test ProformaViewer.sln -c Release --no-restore
   - run: dotnet publish src/ProformaViewer/ProformaViewer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
   - uses: actions/upload-artifact@v4
     with:
      name: ProformaViewer-win-x64
      path: publish
